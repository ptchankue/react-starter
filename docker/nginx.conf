# Shared nginx config for single-page apps (React Router / Expo Router web).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # Fingerprinted build assets never change: cache them for a year.
  location ~* ^/(assets|_expo)/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # .webmanifest is not in nginx's default mime.types.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Service worker and HTML must always be revalidated so updates ship.
  location ~* (sw\.js|workbox-.*\.js|registerSW\.js|index\.html)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Client-side routing: unknown paths fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
